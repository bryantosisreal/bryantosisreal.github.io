<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>jasa khas bryantos</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 8px;
}

p {
    color: #aaa;
}

input {
    margin: 15px;
}

canvas {
    width: 92vw;
    height: 92vw;

    max-width: 650px;
    max-height: 650px;

    display: block;
    margin: 10px auto;

    border: 2px solid #444;
}

</style>
</head>

<body>

<h1>keselek durian 67 hari</h1>

<p>loh kok berubah</p>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<br>

<canvas id="canvas"></canvas>


<script>

// ====================================================
// SETTINGS
// ====================================================

// Actual pixel resolution.
//
// 200 × 200 = 40,000 pixels.
//
// This is a good balance between detail and performance.

const WIDTH = 200;
const HEIGHT = 200;


// Animation time

const ANIMATION_TIME = 12000;


// Target files

const TARGETS = [
    "image1.png",
    "image2.png",
    "image3.png"
];


// Number of color buckets.
//
// More buckets = more accurate color matching,
// but slightly more processing.

const HUE_BUCKETS = 24;
const SAT_BUCKETS = 6;
const LIGHT_BUCKETS = 12;


// ====================================================
// SETUP
// ====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const input =
    document.getElementById("imageInput");


canvas.width = WIDTH;
canvas.height = HEIGHT;


// Previous target

let lastTarget = null;


// ====================================================
// CLAMP
// ====================================================

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


// ====================================================
// RGB → HSL
// ====================================================

function rgbToHsl(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    const lightness =
        (max + min) / 2;

    let h = 0;
    let s = 0;


    if (max !== min) {

        const d =
            max - min;


        s =
            lightness > 0.5
                ? d / (2 - max - min)
                : d / (max + min);


        if (max === r) {

            h =
                (g - b) / d +
                (g < b ? 6 : 0);

        }
        else if (max === g) {

            h =
                (b - r) / d +
                2;

        }
        else {

            h =
                (r - g) / d +
                4;
        }


        h /= 6;
    }


    return {
        h,
        s,
        l: lightness
    };
}


// ====================================================
// LOAD IMAGE
// ====================================================

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();


            img.onload = () =>
                resolve(img);


            img.onerror = () =>
                reject();


            img.src = src;
        }
    );
}


// ====================================================
// CROP IMAGE
// ====================================================

function drawCover(
    img
) {

    const scale =
        Math.max(
            WIDTH / img.width,
            HEIGHT / img.height
        );


    const w =
        img.width * scale;

    const h =
        img.height * scale;


    const x =
        (WIDTH - w) / 2;

    const y =
        (HEIGHT - h) / 2;


    ctx.drawImage(
        img,
        x,
        y,
        w,
        h
    );
}


// ====================================================
// VALID TARGETS
// ====================================================

async function getValidTargets() {

    const valid = [];


    for (
        const filename
        of TARGETS
    ) {

        try {

            const img =
                await loadImage(
                    filename
                );


            valid.push({
                name: filename,
                image: img
            });


        }
        catch {

            console.log(
                "Ignoring:",
                filename
            );
        }
    }


    return valid;
}


// ====================================================
// RANDOM TARGET
// ====================================================

async function getRandomTarget() {

    const valid =
        await getValidTargets();


    if (valid.length === 0) {

        return null;
    }


    if (valid.length === 1) {

        lastTarget =
            valid[0].name;

        return valid[0];
    }


    const available =
        valid.filter(
            x =>
                x.name !== lastTarget
        );


    const selected =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    lastTarget =
        selected.name;


    return selected;
}


// ====================================================
// COLOR BUCKET
// ====================================================

function getBucket(
    h,
    s,
    l
) {

    let hb =
        Math.floor(
            h * HUE_BUCKETS
        );

    let sb =
        Math.floor(
            s * SAT_BUCKETS
        );

    let lb =
        Math.floor(
            l * LIGHT_BUCKETS
        );


    hb =
        clamp(
            hb,
            0,
            HUE_BUCKETS - 1
        );


    sb =
        clamp(
            sb,
            0,
            SAT_BUCKETS - 1
        );


    lb =
        clamp(
            lb,
            0,
            LIGHT_BUCKETS - 1
        );


    return (
        hb +
        sb * HUE_BUCKETS +
        lb *
        HUE_BUCKETS *
        SAT_BUCKETS
    );
}


// ====================================================
// HUE DISTANCE
// ====================================================

function hueDistance(a, b) {

    let d =
        Math.abs(a - b);


    if (d > 0.5) {

        d =
            1 - d;
    }


    return d;
}


// ====================================================
// COLOR DISTANCE
// ====================================================

function colorDistance(
    a,
    b
) {

    const hue =
        hueDistance(
            a.h,
            b.h
        );


    const saturation =
        Math.abs(
            a.s -
            b.s
        );


    const lightness =
        Math.abs(
            a.l -
            b.l
        );


    // Hue matters the most.
    //
    // Saturation and brightness still matter.

    return (
        hue * 0.55 +
        saturation * 0.20 +
        lightness * 0.25
    );
}


// ====================================================
// CREATE BUCKETS
// ====================================================

function createBuckets() {

    return new Array(
        HUE_BUCKETS *
        SAT_BUCKETS *
        LIGHT_BUCKETS
    ).fill(null).map(
        () => []
    );
}


// ====================================================
// FIND BEST PIXEL
// ====================================================

function findBestPixel(
    target,
    buckets,
    maxRadius
) {

    const targetHB =
        Math.floor(
            target.h *
            HUE_BUCKETS
        );


    const targetSB =
        Math.floor(
            target.s *
            SAT_BUCKETS
        );


    const targetLB =
        Math.floor(
            target.l *
            LIGHT_BUCKETS
        );


    let best =
        null;

    let bestDistance =
        Infinity;


    // Search nearby color buckets.
    //
    // Start close and expand only when necessary.

    for (
        let radius = 0;
        radius <= maxRadius;
        radius++
    ) {

        let foundSomething =
            false;


        for (
            let dh = -radius;
            dh <= radius;
            dh++
        ) {

            let hb =
                targetHB + dh;


            // Hue wraps around.

            hb =
                (
                    hb %
                    HUE_BUCKETS +
                    HUE_BUCKETS
                ) %
                HUE_BUCKETS;


            for (
                let ds = -radius;
                ds <= radius;
                ds++
            ) {

                const sb =
                    targetSB + ds;


                if (
                    sb < 0 ||
                    sb >= SAT_BUCKETS
                ) {
                    continue;
                }


                for (
                    let dl = -radius;
                    dl <= radius;
                    dl++
                ) {

                    const lb =
                        targetLB + dl;


                    if (
                        lb < 0 ||
                        lb >= LIGHT_BUCKETS
                    ) {
                        continue;
                    }


                    const bucketIndex =
                        hb +
                        sb *
                        HUE_BUCKETS +
                        lb *
                        HUE_BUCKETS *
                        SAT_BUCKETS;


                    const bucket =
                        buckets[
                            bucketIndex
                        ];


                    if (
                        bucket.length === 0
                    ) {
                        continue;
                    }


                    foundSomething =
                        true;


                    // Check pixels inside bucket.

                    for (
                        let i = 0;
                        i < bucket.length;
                        i++
                    ) {

                        const pixel =
                            bucket[i];


                        const distance =
                            colorDistance(
                                pixel,
                                target
                            );


                        if (
                            distance <
                            bestDistance
                        ) {

                            bestDistance =
                                distance;

                            best =
                                pixel;
                        }
                    }
                }
            }
        }


        // Once we've found candidates
        // nearby, don't search the entire
        // color space.

        if (
            foundSomething &&
            best !== null
        ) {

            return best;
        }
    }


    // Fallback:
    // find anything that remains.

    for (
        const bucket
        of buckets
    ) {

        if (
            bucket.length > 0
        ) {

            return bucket[
                bucket.length - 1
            ];
        }
    }


    return null;
}


// ====================================================
// REMOVE PIXEL FROM BUCKET
// ====================================================

function removePixel(
    pixel
) {

    const bucket =
        pixel.bucket;


    const index =
        bucket.indexOf(
            pixel
        );


    if (index !== -1) {

        bucket.splice(
            index,
            1
        );
    }
}


// ====================================================
// MAIN
// ====================================================

input.addEventListener(
    "change",
    async () => {

        const file =
            input.files[0];


        if (!file) {
            return;
        }


        // --------------------------------------------
        // LOAD UPLOADED IMAGE
        // --------------------------------------------

        const uploadedURL =
            URL.createObjectURL(
                file
            );


        let uploaded;


        try {

            uploaded =
                await loadImage(
                    uploadedURL
                );

        }
        catch {

            alert(
                "Couldn't load that image."
            );

            URL.revokeObjectURL(
                uploadedURL
            );

            return;
        }


        // --------------------------------------------
        // CHOOSE TARGET
        // --------------------------------------------

        const selectedTarget =
            await getRandomTarget();


        if (!selectedTarget) {

            alert(
                "No target images found! Add image1.png, image2.png, or image3.png."
            );

            URL.revokeObjectURL(
                uploadedURL
            );

            return;
        }


        const target =
            selectedTarget.image;


        console.log(
            "Target:",
            selectedTarget.name
        );


        // --------------------------------------------
        // SOURCE IMAGE DATA
        // --------------------------------------------

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        drawCover(
            uploaded
        );


        const sourceData =
            ctx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            ).data;


        // --------------------------------------------
        // TARGET IMAGE DATA
        // --------------------------------------------

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        drawCover(
            target
        );


        const targetData =
            ctx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            ).data;


        // --------------------------------------------
        // SOURCE PIXELS
        // --------------------------------------------

        const sourcePixels = [];


        const buckets =
            createBuckets();


        for (
            let i = 0;
            i < WIDTH * HEIGHT;
            i++
        ) {

            const index =
                i * 4;


            const r =
                sourceData[index];

            const g =
                sourceData[index + 1];

            const b =
                sourceData[index + 2];


            const hsl =
                rgbToHsl(
                    r,
                    g,
                    b
                );


            const pixel = {

                r,
                g,
                b,

                h: hsl.h,
                s: hsl.s,
                l: hsl.l,

                startX:
                    i % WIDTH,

                startY:
                    Math.floor(
                        i / WIDTH
                    ),

                x:
                    i % WIDTH,

                y:
                    Math.floor(
                        i / WIDTH
                    ),

                targetX: 0,
                targetY: 0,

                bucket: null
            };


            const bucketIndex =
                getBucket(
                    pixel.h,
                    pixel.s,
                    pixel.l
                );


            const bucket =
                buckets[
                    bucketIndex
                ];


            pixel.bucket =
                bucket;


            bucket.push(
                pixel
            );


            sourcePixels.push(
                pixel
            );
        }


        // --------------------------------------------
        // TARGET PIXELS
        // --------------------------------------------

        const targetPixels = [];


        for (
            let i = 0;
            i < WIDTH * HEIGHT;
            i++
        ) {

            const index =
                i * 4;


            const r =
                targetData[index];

            const g =
                targetData[index + 1];

            const b =
                targetData[index + 2];


            const hsl =
                rgbToHsl(
                    r,
                    g,
                    b
                );


            targetPixels.push({

                r,
                g,
                b,

                h: hsl.h,
                s: hsl.s,
                l: hsl.l,

                x:
                    i % WIDTH,

                y:
                    Math.floor(
                        i / WIDTH
                    )
            });
        }


        // ====================================================
        // MATCH EVERY TARGET LOCATION
        // ====================================================

        console.log(
            "Matching pixels..."
        );


        for (
            const targetPixel
            of targetPixels
        ) {

            const sourcePixel =
                findBestPixel(
                    targetPixel,
                    buckets,
                    3
                );


            if (!sourcePixel) {
                continue;
            }


            // Give this source pixel
            // the target's position.

            sourcePixel.targetX =
                targetPixel.x;

            sourcePixel.targetY =
                targetPixel.y;


            // Remove it so another target
            // position cannot use the same pixel.

            removePixel(
                sourcePixel
            );
        }


        console.log(
            "Pixel matching complete."
        );


        // ====================================================
        // ANIMATION
        // ====================================================

        const startTime =
            performance.now();


        function animate(now) {

            const elapsed =
                now - startTime;


            const progress =
                clamp(
                    elapsed /
                    ANIMATION_TIME,
                    0,
                    1
                );


            // Smooth movement

            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    3
                );


            ctx.clearRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );


            // --------------------------------------------
            // MOVE PIXELS
            // --------------------------------------------

            for (
                const pixel
                of sourcePixels
            ) {

                pixel.x =
                    pixel.startX +
                    (
                        pixel.targetX -
                        pixel.startX
                    ) *
                    eased;


                pixel.y =
                    pixel.startY +
                    (
                        pixel.targetY -
                        pixel.startY
                    ) *
                    eased;


                // ORIGINAL COLOR.
                //
                // We NEVER change r/g/b.

                ctx.fillStyle =
                    `rgb(
                        ${pixel.r},
                        ${pixel.g},
                        ${pixel.b}
                    )`;


                ctx.fillRect(
                    Math.round(
                        pixel.x
                    ),
                    Math.round(
                        pixel.y
                    ),
                    1,
                    1
                );
            }


            // --------------------------------------------
            // CONTINUE
            // --------------------------------------------

            if (
                progress < 1
            ) {

                requestAnimationFrame(
                    animate
                );

            }
            else {

                // Final frame

                ctx.clearRect(
                    0,
                    0,
                    WIDTH,
                    HEIGHT
                );


                for (
                    const pixel
                    of sourcePixels
                ) {

                    ctx.fillStyle =
                        `rgb(
                            ${pixel.r},
                            ${pixel.g},
                            ${pixel.b}
                        )`;


                    ctx.fillRect(
                        pixel.targetX,
                        pixel.targetY,
                        1,
                        1
                    );
                }
            }
        }


        requestAnimationFrame(
            animate
        );


        URL.revokeObjectURL(
            uploadedURL
        );

    }
);

</script>

</body>
</html>
