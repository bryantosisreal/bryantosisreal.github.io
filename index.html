<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>jasa khas bryantos</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 8px;
}

p {
    color: #aaa;
}

input {
    margin: 15px;
}

canvas {
    width: 90vw;
    height: 90vw;
    max-width: 600px;
    max-height: 600px;

    border: 2px solid #444;

    image-rendering: pixelated;

    display: block;
    margin: 10px auto;
}

</style>
</head>

<body>

<h1>keselek durian 67 hari</h1>

<p>loh kok berubah, masukin gambar aja</p>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<br>

<canvas id="canvas"></canvas>


<script>

// ====================================================
// SETTINGS
// ====================================================

// Actual pixel resolution.
// Lower = less lag.
// The canvas is scaled up visually.

const WIDTH = 120;
const HEIGHT = 120;


// Animation duration in milliseconds.
// 12000 = 12 seconds.

const ANIMATION_TIME = 12000;


// Target images in your repository.

const TARGETS = [
    "image1.png",
    "image2.png",
    "image3.png"
];


// ====================================================
// SETUP
// ====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const input =
    document.getElementById("imageInput");


// Actual canvas resolution

canvas.width = WIDTH;
canvas.height = HEIGHT;


// Remember the previous target

let lastTarget = null;


// ====================================================
// UTILITY
// ====================================================

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


// ====================================================
// RGB → HSL
// ====================================================

function rgbToHsl(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    let h = 0;
    let s = 0;

    const l =
        (max + min) / 2;


    if (max !== min) {

        const d =
            max - min;


        s =
            l > 0.5
                ? d / (2 - max - min)
                : d / (max + min);


        switch (max) {

            case r:

                h =
                    (g - b) / d +
                    (g < b ? 6 : 0);

                break;


            case g:

                h =
                    (b - r) / d +
                    2;

                break;


            case b:

                h =
                    (r - g) / d +
                    4;

                break;
        }


        h /= 6;
    }


    return {
        h,
        s,
        l
    };
}


// ====================================================
// LOAD IMAGE
// ====================================================

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();


            img.onload = () => {

                resolve(img);

            };


            img.onerror = () => {

                reject();

            };


            img.src = src;
        }
    );
}


// ====================================================
// DRAW IMAGE WITH CROPPING
// ====================================================

function drawCover(
    ctx,
    img,
    width,
    height
) {

    const scale =
        Math.max(
            width / img.width,
            height / img.height
        );


    const w =
        img.width * scale;

    const h =
        img.height * scale;


    const x =
        (width - w) / 2;

    const y =
        (height - h) / 2;


    ctx.drawImage(
        img,
        x,
        y,
        w,
        h
    );
}


// ====================================================
// FIND VALID TARGET IMAGES
// ====================================================

async function getValidTargets() {

    const valid = [];


    for (
        const filename of TARGETS
    ) {

        try {

            const img =
                await loadImage(
                    filename
                );


            valid.push({

                name: filename,

                image: img

            });


        } catch {

            console.log(
                "Ignoring missing image:",
                filename
            );
        }
    }


    return valid;
}


// ====================================================
// GET RANDOM TARGET
// ====================================================

async function getRandomTarget() {

    const validTargets =
        await getValidTargets();


    // No target images

    if (
        validTargets.length === 0
    ) {

        return null;
    }


    // Only one valid target.
    // We have no choice.

    if (
        validTargets.length === 1
    ) {

        lastTarget =
            validTargets[0].name;

        return validTargets[0];
    }


    // Remove the previous target

    const available =
        validTargets.filter(
            target =>
                target.name !== lastTarget
        );


    // Pick random target

    const selected =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    // Remember it

    lastTarget =
        selected.name;


    return selected;
}


// ====================================================
// DRAW ONE PIXEL
// ====================================================

function drawPixel(pixel) {

    // IMPORTANT:
    //
    // The original RGB values are used.
    // We NEVER modify the color.

    ctx.fillStyle =
        `rgb(
            ${pixel.r},
            ${pixel.g},
            ${pixel.b}
        )`;


    ctx.fillRect(

        Math.round(pixel.x),

        Math.round(pixel.y),

        1,

        1
    );
}


// ====================================================
// MAIN
// ====================================================

input.addEventListener(
    "change",
    async () => {

        const file =
            input.files[0];


        if (!file) {
            return;
        }


        // --------------------------------------------
        // Load uploaded image
        // --------------------------------------------

        const uploadedURL =
            URL.createObjectURL(
                file
            );


        const uploaded =
            await loadImage(
                uploadedURL
            );


        // --------------------------------------------
        // Pick target
        // --------------------------------------------

        const selectedTarget =
            await getRandomTarget();


        if (!selectedTarget) {

            alert(
                "No target images found! Add image1.png, image2.png, or image3.png."
            );

            URL.revokeObjectURL(
                uploadedURL
            );

            return;
        }


        const target =
            selectedTarget.image;


        console.log(
            "Selected target:",
            selectedTarget.name
        );


        // --------------------------------------------
        // SOURCE IMAGE
        // --------------------------------------------

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        drawCover(
            ctx,
            uploaded,
            WIDTH,
            HEIGHT
        );


        const sourceData =
            ctx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            ).data;


        // --------------------------------------------
        // TARGET IMAGE
        // --------------------------------------------

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        drawCover(
            ctx,
            target,
            WIDTH,
            HEIGHT
        );


        const targetData =
            ctx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            ).data;


        // --------------------------------------------
        // CREATE SOURCE PIXELS
        // --------------------------------------------

        const sourcePixels = [];


        for (
            let i = 0;
            i < WIDTH * HEIGHT;
            i++
        ) {

            const index =
                i * 4;


            const r =
                sourceData[index];

            const g =
                sourceData[index + 1];

            const b =
                sourceData[index + 2];


            const hsl =
                rgbToHsl(
                    r,
                    g,
                    b
                );


            sourcePixels.push({

                r,
                g,
                b,

                h: hsl.h,
                s: hsl.s,
                l: hsl.l,

                startX:
                    i % WIDTH,

                startY:
                    Math.floor(
                        i / WIDTH
                    ),

                x:
                    i % WIDTH,

                y:
                    Math.floor(
                        i / WIDTH
                    ),

                targetX: 0,

                targetY: 0
            });
        }


        // --------------------------------------------
        // CREATE TARGET POSITIONS
        // --------------------------------------------

        const targetPixels = [];


        for (
            let i = 0;
            i < WIDTH * HEIGHT;
            i++
        ) {

            const index =
                i * 4;


            const r =
                targetData[index];

            const g =
                targetData[index + 1];

            const b =
                targetData[index + 2];


            const hsl =
                rgbToHsl(
                    r,
                    g,
                    b
                );


            targetPixels.push({

                r,
                g,
                b,

                h: hsl.h,
                s: hsl.s,
                l: hsl.l,

                x:
                    i % WIDTH,

                y:
                    Math.floor(
                        i / WIDTH
                    )
            });
        }


        // ====================================================
        // MATCH PIXELS BY BRIGHTNESS
        // ====================================================

        // Dark source pixels go toward
        // dark target positions.

        sourcePixels.sort(
            (a, b) =>
                a.l - b.l
        );


        targetPixels.sort(
            (a, b) =>
                a.l - b.l
        );


        // Each target position is assigned
        // to exactly one source pixel.

        for (
            let i = 0;
            i < sourcePixels.length;
            i++
        ) {

            const source =
                sourcePixels[i];

            const targetPixel =
                targetPixels[i];


            source.targetX =
                targetPixel.x;

            source.targetY =
                targetPixel.y;
        }


        // ====================================================
        // ANIMATION
        // ====================================================

        const startTime =
            performance.now();


        function animate(now) {

            const elapsed =
                now - startTime;


            const progress =
                clamp(
                    elapsed /
                    ANIMATION_TIME,

                    0,
                    1
                );


            // Smooth ease-out

            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    3
                );


            ctx.clearRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );


            // --------------------------------------------
            // MOVE PIXELS
            // --------------------------------------------

            for (
                const pixel
                of sourcePixels
            ) {

                pixel.x =
                    pixel.startX +
                    (
                        pixel.targetX -
                        pixel.startX
                    ) *
                    eased;


                pixel.y =
                    pixel.startY +
                    (
                        pixel.targetY -
                        pixel.startY
                    ) *
                    eased;


                drawPixel(
                    pixel
                );
            }


            // --------------------------------------------
            // CONTINUE ANIMATION
            // --------------------------------------------

            if (
                progress < 1
            ) {

                requestAnimationFrame(
                    animate
                );

            } else {

                // ----------------------------------------
                // FINAL FRAME
                // ----------------------------------------

                ctx.clearRect(
                    0,
                    0,
                    WIDTH,
                    HEIGHT
                );


                for (
                    const pixel
                    of sourcePixels
                ) {

                    pixel.x =
                        pixel.targetX;

                    pixel.y =
                        pixel.targetY;


                    drawPixel(
                        pixel
                    );
                }
            }
        }


        requestAnimationFrame(
            animate
        );


        // Clean up uploaded image URL

        URL.revokeObjectURL(
            uploadedURL
        );

    }
);

</script>

</body>
</html>
