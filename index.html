<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>jasa khas bryantos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 8px;
}

p {
    color: #aaa;
}

input {
    margin: 15px;
}

canvas {
    max-width: 95vw;
    max-height: 75vh;
    border: 1px solid #444;
    image-rendering: pixelated;
}
</style>
</head>

<body>

<h1>keselek durian 67 hari</h1>

<p>loh kok berubah ya</p>

<input type="file" id="imageInput" accept="image/*">

<br>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const input = document.getElementById("imageInput");


// ====================================================
// TARGET IMAGES
// ====================================================

const TARGETS = [
    "image1.png",
    "image2.png",
    "image3.png"
];


// How long the transformation takes
const ANIMATION_TIME = 12000;


// Resolution
const WIDTH = 160;
const HEIGHT = 160;


// ====================================================
// Utility
// ====================================================

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}


// RGB → HSL
function rgbToHsl(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);

    let h = 0;
    let s = 0;

    const l = (max + min) / 2;

    if (max !== min) {

        const d = max - min;

        s = l > 0.5
            ? d / (2 - max - min)
            : d / (max + min);

        switch (max) {

            case r:
                h = (g - b) / d + (g < b ? 6 : 0);
                break;

            case g:
                h = (b - r) / d + 2;
                break;

            case b:
                h = (r - g) / d + 4;
                break;
        }

        h /= 6;
    }

    return {
        h,
        s,
        l
    };
}


// ====================================================
// Load image
// ====================================================

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () => reject();

        img.src = src;
    });
}


// ====================================================
// Crop image to fill canvas
// ====================================================

function drawCover(ctx, img, width, height) {

    const scale = Math.max(
        width / img.width,
        height / img.height
    );

    const w = img.width * scale;
    const h = img.height * scale;

    const x = (width - w) / 2;
    const y = (height - h) / 2;

    ctx.drawImage(
        img,
        x,
        y,
        w,
        h
    );
}


// ====================================================
// Find valid target images
// ====================================================

async function getValidTargets() {

    const valid = [];

    for (const filename of TARGETS) {

        try {

            const img = await loadImage(filename);

            valid.push({
                name: filename,
                image: img
            });

        } catch {

            console.log(
                "Ignoring missing image:",
                filename
            );
        }
    }

    return valid;
}


// ====================================================
// Main
// ====================================================

input.addEventListener("change", async () => {

    const file = input.files[0];

    if (!file) return;


    // ------------------------------------------------
    // Load uploaded image
    // ------------------------------------------------

    const uploadedURL =
        URL.createObjectURL(file);

    const uploaded =
        await loadImage(uploadedURL);


    // ------------------------------------------------
    // Find available target images
    // ------------------------------------------------

    const validTargets =
        await getValidTargets();


    // If absolutely none exist
    if (validTargets.length === 0) {

        alert(
            "No target images found! Add image1.png, image2.png, or image3.png."
        );

        return;
    }


    // ------------------------------------------------
    // Pick RANDOM target
    // ------------------------------------------------

    const selectedTarget =
        validTargets[
            Math.floor(
                Math.random() *
                validTargets.length
            )
        ];


    console.log(
        "Selected target:",
        selectedTarget.name
    );


    const target =
        selectedTarget.image;


    // ------------------------------------------------
    // Canvas
    // ------------------------------------------------

    canvas.width = WIDTH;
    canvas.height = HEIGHT;


    // ------------------------------------------------
    // Get source image pixels
    // ------------------------------------------------

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawCover(
        ctx,
        uploaded,
        WIDTH,
        HEIGHT
    );

    const sourceData =
        ctx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        ).data;


    // ------------------------------------------------
    // Get target pixels
    // ------------------------------------------------

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawCover(
        ctx,
        target,
        WIDTH,
        HEIGHT
    );

    const targetData =
        ctx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        ).data;


    // ------------------------------------------------
    // Create source pixels
    // ------------------------------------------------

    const sourcePixels = [];

    const targetPixels = [];


    for (
        let i = 0;
        i < WIDTH * HEIGHT;
        i++
    ) {

        const index = i * 4;

        const r = sourceData[index];
        const g = sourceData[index + 1];
        const b = sourceData[index + 2];

        const hsl =
            rgbToHsl(r, g, b);


        sourcePixels.push({

            r,
            g,
            b,

            h: hsl.h,
            s: hsl.s,
            l: hsl.l,

            startX: i % WIDTH,
            startY: Math.floor(i / WIDTH),

            x: i % WIDTH,
            y: Math.floor(i / WIDTH),

            targetX: 0,
            targetY: 0
        });
    }


    // ------------------------------------------------
    // Create target pixels
    // ------------------------------------------------

    for (
        let i = 0;
        i < WIDTH * HEIGHT;
        i++
    ) {

        const index = i * 4;

        const r = targetData[index];
        const g = targetData[index + 1];
        const b = targetData[index + 2];

        const hsl =
            rgbToHsl(r, g, b);


        targetPixels.push({

            r,
            g,
            b,

            h: hsl.h,
            s: hsl.s,
            l: hsl.l,

            x: i % WIDTH,
            y: Math.floor(i / WIDTH)
        });
    }


    // =================================================
    // PIXEL MATCHING
    // =================================================

    // Sort source pixels by brightness
    sourcePixels.sort(
        (a, b) => a.l - b.l
    );


    // Sort target positions by brightness
    targetPixels.sort(
        (a, b) => a.l - b.l
    );


    // Match them
    for (
        let i = 0;
        i < sourcePixels.length;
        i++
    ) {

        const source =
            sourcePixels[i];

        const target =
            targetPixels[i];


        source.targetX =
            target.x;

        source.targetY =
            target.y;
    }


    // =================================================
    // ANIMATION
    // =================================================

    const startTime =
        performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;


        let progress =
            clamp(
                elapsed /
                ANIMATION_TIME,
                0,
                1
            );


        // Smooth ease-out
        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        // ------------------------------------------------
        // Draw every pixel
        // ------------------------------------------------

        for (const pixel of sourcePixels) {

            pixel.x =
                pixel.startX +
                (
                    pixel.targetX -
                    pixel.startX
                ) *
                eased;


            pixel.y =
                pixel.startY +
                (
                    pixel.targetY -
                    pixel.startY
                ) *
                eased;


            // IMPORTANT:
            // Original RGB is preserved.
            // We NEVER modify the pixel color.

            ctx.fillStyle =
                `rgb(
                    ${pixel.r},
                    ${pixel.g},
                    ${pixel.b}
                )`;


            ctx.fillRect(
                Math.round(pixel.x),
                Math.round(pixel.y),
                1,
                1
            );
        }


        // ------------------------------------------------
        // Continue animation
        // ------------------------------------------------

        if (progress < 1) {

            requestAnimationFrame(
                animate
            );

        } else {

            // Final frame

            ctx.clearRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );


            for (const pixel of sourcePixels) {

                ctx.fillStyle =
                    `rgb(
                        ${pixel.r},
                        ${pixel.g},
                        ${pixel.b}
                    )`;


                ctx.fillRect(
                    pixel.targetX,
                    pixel.targetY,
                    1,
                    1
                );
            }
        }
    }


    requestAnimationFrame(
        animate
    );

});

</script>

</body>
</html>
