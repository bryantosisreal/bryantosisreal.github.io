<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>jasa khas bryantos</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 8px;
}

p {
    color: #aaa;
}

input {
    margin: 15px;
}

canvas {
    width: 90vw;
    height: 90vw;

    max-width: 600px;
    max-height: 600px;

    border: 2px solid #444;

    image-rendering: auto;

    display: block;
    margin: 10px auto;
}

</style>
</head>

<body>

<h1>keselek durian 67 hari</h1>

<p>loh kok berubah, gambarmu masukin</p>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<br>

<canvas id="canvas"></canvas>


<script>

// ====================================================
// SETTINGS
// ====================================================

// Actual resolution.
//
// 240 × 240 = 57,600 pixels.
//
// Much smoother than 120 × 120,
// while still being reasonable on a phone.

const WIDTH = 240;
const HEIGHT = 240;


// Transformation duration

const ANIMATION_TIME = 12000;


// Target images

const TARGETS = [
    "image1.png",
    "image2.png",
    "image3.png"
];


// ====================================================
// SETUP
// ====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const input =
    document.getElementById("imageInput");

canvas.width = WIDTH;
canvas.height = HEIGHT;


// Remember previous target

let lastTarget = null;


// ====================================================
// CLAMP
// ====================================================

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


// ====================================================
// RGB → HSL
// ====================================================

function rgbToHsl(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    let h = 0;
    let s = 0;

    const l =
        (max + min) / 2;


    if (max !== min) {

        const d =
            max - min;


        s =
            l > 0.5
                ? d / (2 - max - min)
                : d / (max + min);


        switch (max) {

            case r:

                h =
                    (g - b) / d +
                    (g < b ? 6 : 0);

                break;


            case g:

                h =
                    (b - r) / d +
                    2;

                break;


            case b:

                h =
                    (r - g) / d +
                    4;

                break;
        }


        h /= 6;
    }


    return {
        h,
        s,
        l
    };
}


// ====================================================
// LOAD IMAGE
// ====================================================

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();


            img.onload = () => {
                resolve(img);
            };


            img.onerror = () => {
                reject();
            };


            img.src = src;
        }
    );
}


// ====================================================
// DRAW IMAGE WITH COVER CROP
// ====================================================

function drawCover(
    ctx,
    img,
    width,
    height
) {

    const scale =
        Math.max(
            width / img.width,
            height / img.height
        );


    const w =
        img.width * scale;

    const h =
        img.height * scale;


    const x =
        (width - w) / 2;

    const y =
        (height - h) / 2;


    ctx.drawImage(
        img,
        x,
        y,
        w,
        h
    );
}


// ====================================================
// FIND VALID TARGETS
// ====================================================

async function getValidTargets() {

    const valid = [];


    for (
        const filename of TARGETS
    ) {

        try {

            const img =
                await loadImage(
                    filename
                );


            valid.push({

                name: filename,

                image: img

            });


        } catch {

            console.log(
                "Ignoring missing image:",
                filename
            );
        }
    }


    return valid;
}


// ====================================================
// GET RANDOM TARGET
// ====================================================

async function getRandomTarget() {

    const validTargets =
        await getValidTargets();


    if (
        validTargets.length === 0
    ) {

        return null;
    }


    // If there is only one valid image,
    // we have no alternative.

    if (
        validTargets.length === 1
    ) {

        lastTarget =
            validTargets[0].name;

        return validTargets[0];
    }


    // Remove previous target

    const available =
        validTargets.filter(
            target =>
                target.name !== lastTarget
        );


    const selected =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    lastTarget =
        selected.name;


    return selected;
}


// ====================================================
// HUE DISTANCE
// ====================================================

function hueDistance(a, b) {

    let difference =
        Math.abs(a - b);


    // Hue wraps around.
    //
    // Red at hue 0 and red at hue 1
    // should be considered very close.

    if (difference > 0.5) {

        difference =
            1 - difference;
    }


    return difference;
}


// ====================================================
// COLOR MATCH SCORE
// ====================================================

function colorDifference(source, target) {

    const hueDiff =
        hueDistance(
            source.h,
            target.h
        );


    const saturationDiff =
        Math.abs(
            source.s -
            target.s
        );


    const brightnessDiff =
        Math.abs(
            source.l -
            target.l
        );


    // Lower score = better match.
    //
    // Hue is weighted heavily.
    // Brightness is also important.
    // Saturation gets a smaller weight.

    return (
        hueDiff * 0.50 +
        saturationDiff * 0.20 +
        brightnessDiff * 0.30
    );
}


// ====================================================
// MAIN
// ====================================================

input.addEventListener(
    "change",
    async () => {

        const file =
            input.files[0];


        if (!file) {
            return;
        }


        // --------------------------------------------
        // LOAD UPLOADED IMAGE
        // --------------------------------------------

        const uploadedURL =
            URL.createObjectURL(
                file
            );


        let uploaded;


        try {

            uploaded =
                await loadImage(
                    uploadedURL
                );

        } catch {

            alert(
                "Couldn't load that image."
            );

            URL.revokeObjectURL(
                uploadedURL
            );

            return;
        }


        // --------------------------------------------
        // CHOOSE TARGET
        // --------------------------------------------

        const selectedTarget =
            await getRandomTarget();


        if (!selectedTarget) {

            alert(
                "No target images found! Add image1.png, image2.png, or image3.png."
            );

            URL.revokeObjectURL(
                uploadedURL
            );

            return;
        }


        const target =
            selectedTarget.image;


        console.log(
            "Selected target:",
            selectedTarget.name
        );


        // --------------------------------------------
        // GET SOURCE PIXELS
        // --------------------------------------------

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        drawCover(
            ctx,
            uploaded,
            WIDTH,
            HEIGHT
        );


        const sourceData =
            ctx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            ).data;


        // --------------------------------------------
        // GET TARGET PIXELS
        // --------------------------------------------

        ctx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        drawCover(
            ctx,
            target,
            WIDTH,
            HEIGHT
        );


        const targetData =
            ctx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            ).data;


        // --------------------------------------------
        // SOURCE PIXELS
        // --------------------------------------------

        const sourcePixels = [];


        for (
            let i = 0;
            i < WIDTH * HEIGHT;
            i++
        ) {

            const index =
                i * 4;


            const r =
                sourceData[index];

            const g =
                sourceData[index + 1];

            const b =
                sourceData[index + 2];


            const hsl =
                rgbToHsl(
                    r,
                    g,
                    b
                );


            sourcePixels.push({

                r,
                g,
                b,

                h: hsl.h,
                s: hsl.s,
                l: hsl.l,

                startX:
                    i % WIDTH,

                startY:
                    Math.floor(
                        i / WIDTH
                    ),

                x:
                    i % WIDTH,

                y:
                    Math.floor(
                        i / WIDTH
                    ),

                targetX: 0,

                targetY: 0
            });
        }


        // --------------------------------------------
        // TARGET PIXELS
        // --------------------------------------------

        const targetPixels = [];


        for (
            let i = 0;
            i < WIDTH * HEIGHT;
            i++
        ) {

            const index =
                i * 4;


            const r =
                targetData[index];

            const g =
                targetData[index + 1];

            const b =
                targetData[index + 2];


            const hsl =
                rgbToHsl(
                    r,
                    g,
                    b
                );


            targetPixels.push({

                r,
                g,
                b,

                h: hsl.h,
                s: hsl.s,
                l: hsl.l,

                x:
                    i % WIDTH,

                y:
                    Math.floor(
                        i / WIDTH
                    )
            });
        }


        // ====================================================
        // SORT BY HUE + SATURATION + BRIGHTNESS
        // ====================================================

        // Instead of ONLY brightness,
        // we calculate a combined color value.
        //
        // This makes similar colors tend to end up
        // near similar areas of the target.

        sourcePixels.sort(
            (a, b) => {

                const aValue =
                    a.h * 0.50 +
                    a.s * 0.20 +
                    a.l * 0.30;


                const bValue =
                    b.h * 0.50 +
                    b.s * 0.20 +
                    b.l * 0.30;


                return aValue - bValue;
            }
        );


        targetPixels.sort(
            (a, b) => {

                const aValue =
                    a.h * 0.50 +
                    a.s * 0.20 +
                    a.l * 0.30;


                const bValue =
                    b.h * 0.50 +
                    b.s * 0.20 +
                    b.l * 0.30;


                return aValue - bValue;
            }
        );


        // ====================================================
        // ASSIGN TARGET POSITIONS
        // ====================================================

        // Every target position is used exactly once.

        for (
            let i = 0;
            i < sourcePixels.length;
            i++
        ) {

            const source =
                sourcePixels[i];

            const targetPixel =
                targetPixels[i];


            source.targetX =
                targetPixel.x;

            source.targetY =
                targetPixel.y;
        }


        // ====================================================
        // ANIMATION
        // ====================================================

        const startTime =
            performance.now();


        function animate(now) {

            const elapsed =
                now - startTime;


            const progress =
                clamp(
                    elapsed /
                    ANIMATION_TIME,

                    0,
                    1
                );


            // Smooth ease-out

            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    3
                );


            ctx.clearRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );


            // --------------------------------------------
            // MOVE PIXELS
            // --------------------------------------------

            for (
                const pixel
                of sourcePixels
            ) {

                pixel.x =
                    pixel.startX +
                    (
                        pixel.targetX -
                        pixel.startX
                    ) *
                    eased;


                pixel.y =
                    pixel.startY +
                    (
                        pixel.targetY -
                        pixel.startY
                    ) *
                    eased;


                // ORIGINAL COLOR
                //
                // No hue/saturation modification.

                ctx.fillStyle =
                    `rgb(
                        ${pixel.r},
                        ${pixel.g},
                        ${pixel.b}
                    )`;


                ctx.fillRect(

                    Math.round(
                        pixel.x
                    ),

                    Math.round(
                        pixel.y
                    ),

                    1,
                    1
                );
            }


            // --------------------------------------------
            // CONTINUE
            // --------------------------------------------

            if (
                progress < 1
            ) {

                requestAnimationFrame(
                    animate
                );


            } else {

                // Final frame

                ctx.clearRect(
                    0,
                    0,
                    WIDTH,
                    HEIGHT
                );


                for (
                    const pixel
                    of sourcePixels
                ) {

                    ctx.fillStyle =
                        `rgb(
                            ${pixel.r},
                            ${pixel.g},
                            ${pixel.b}
                        )`;


                    ctx.fillRect(

                        pixel.targetX,

                        pixel.targetY,

                        1,
                        1
                    );
                }
            }
        }


        requestAnimationFrame(
            animate
        );


        URL.revokeObjectURL(
            uploadedURL
        );

    }
);

</script>

</body>
</html>
